name: Flipper FAP Build
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ufbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ufbt installieren
        run: pip install --upgrade ufbt
      - name: FAP bauen (offizielles SDK; Momentum-API kann abweichen)
        continue-on-error: true
        run: ufbt
      - name: FAP-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: fap-${{ github.sha }}
          path: dist/*.fap
          if-no-files-found: ignore
